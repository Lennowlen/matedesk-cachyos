name: Build & Release MateDesk APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Release APK
        run: |
          cd app
          flutter build apk --release

      - name: Rename APK
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk app/build/app/outputs/flutter-apk/MateDesk-CachyOS-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MateDesk-CachyOS-APK
          path: app/build/app/outputs/flutter-apk/MateDesk-CachyOS-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: MateDesk CachyOS Edition ${{ github.ref_name }}
          body: |
            ## 🚀 MateDesk CachyOS Edition Release
            
            ### ✨ Highlights:
            - **CachyOS UI & Arch ARM64 Base**
            - **HiSilicon Maleoon GPU Hardware Acceleration (VirGL)**
            - **Optimized for Huawei MatePad 12 X (3:2 2.8K display)**
            - **Integrated Termux-X11 display server**
            
            ### 📥 Download:
            Download `MateDesk-CachyOS-release.apk` below and install it directly on your Huawei MatePad 12 X!
          files: app/build/app/outputs/flutter-apk/MateDesk-CachyOS-release.apk
